name: Windows build
on:
  workflow_dispatch:
  push:
    branches: ["arena/5ade095f-wincat"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - name: Build Windows application
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content windows-build.log -Tail 60 | ForEach-Object { $line = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'; Write-Host "::error::$line" }
            exit $code
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish native build diagnostics
        if: failure()
        run: |
          $files = Get-ChildItem native/bin/*.json -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "::error::No native compiler result file was created." }
          foreach ($file in $files) {
            $text = (Get-Content $file.FullName -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Native compiler result::$text"
          }
          if (Test-Path windows-build.log) {
            $tail = (Get-Content windows-build.log -Tail 35) -join "`n"
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Windows build log::$tail"
          }
      - name: Native hook self-test
        run: |
          & ./native/bin/desktop-cat-input.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native observer self-test failed" }
      - name: Packaged app launch and lifecycle smoke test
        env:
          DESKTOP_CAT_SMOKE_REPORT: ${{ github.workspace }}\release\smoke-report.json
        run: |
          $process = Start-Process -FilePath "release/win-unpacked/Desktop Cat.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; Write-Host "::error::Packaged launch timed out"; exit 1 }
          if ($process.ExitCode -ne 0) { Get-Content release/smoke-report.json | ForEach-Object { Write-Host "::error::$_" }; throw "Packaged app smoke test failed" }
          $report = Get-Content release/smoke-report.json | ConvertFrom-Json
          if (-not $report.passed) { throw "Packaged app smoke report did not pass" }
          Get-Content release/smoke-report.json
      - name: Checksums
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Cat-Windows-x64-unsigned
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/smoke-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-failure-diagnostics
          path: |
            release/smoke-report.json
            release/builder-debug.yml
            native/bin/*.json
            windows-build.log
